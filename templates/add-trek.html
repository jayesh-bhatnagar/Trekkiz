{% extends 'dash-base.html' %} 
{% block title %}Create New Trek | Trekkiz{%endblock %}
{% block brand_name %}
<a class="navbar-brand fw-bold fs-3 text-success align-items-center"
  href="{{ url_for('admin_dash') }}">
  Trekkiz
</a>
{% endblock %} 
{% block content %}
<div class="row justify-content-center">
  <div class="card border-0 shadow-sm w-100 p-2" style="max-width: 450px">
    <div class="card-header bg-white py-3 border-0 d-flex justify-content-between align-items-center">
      <h5 class="card-title fw-bold mb-0" style="color: #157649">Add Trek</h5>
      <div class="d-flex gap-2">
        <a href="{{ url_for('treks') }}" class="btn btn-outline-secondary btn-sm">
          Cancel and Return
        </a>
      </div>
    </div>
    <form action="{{ url_for('newTrek') }}" class="form-control" method="POST">
      <div class="row">
        <div class="col-md-6 mb-3">
          <label for="name" class="form-label fw-bold">
            Trek Name
          </label>
          <input type="text" class="form-control" id="name" name="name" required/>
        </div>
        <div class="col-md-6 mb-3">
          <label for="location" class="form-label fw-bold">
            Location/Region
          </label>
          <input type="text" class="form-control" id="location" name="location" required/>
        </div>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <div class="mb-3">
            <label for="difficulty" class="form-label fw-bold">
              Difficulty Level
            </label>
            <select class="form-select" id="difficulty" name="difficulty" required>

              <option value="Easy">Easy</option>
              <option value="Medium">Medium</option>
              <option value="Hard">Hard</option>
            </select>
          </div>
        </div>
        <div class="col-md-6 mb-3">
          <div class="mb-3">
            <label for="status" class="form-label fw-bold">
              Status
            </label>
            <select class="form-select" id="status" name="status" required>

              <option value="Open">Open</option>
              <option value="Closed">Closed</option>
              <option value="Started">Started</option>
              <option value="Completed">Completed</option>
            </select>
          </div>
        </div>
      </div>

      <div class="mb-3">
        <label for="slots" class="form-label fw-bold">
          Total Slots
        </label>
        <input type="number" class="form-control" id="available_slots" name="slots" min="1" required/>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label for="begins_on" class="form-label fw-bold">
            Start Date
          </label>
          <input type="date" class="form-control" id="begins_on" name="startDate" required/>
        </div>
        <div class="col-md-6 mb-3">
          <label for="ends_on" class="form-label fw-bold">
            End Date
          </label>
          <input type="date" class="form-control" id="ends_on" name="endDate" required/>
        </div>
      </div>

      <div class="d-grid gap-2 mb-2 mt-2">
        <button type="submit" class="btn btn-success">Publish Trek</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
